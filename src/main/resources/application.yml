spring:
  application:
    name: review-gateway
  threads:
    virtual:
      enabled: true                 # Java 21 virtual threads (requirements §2.1)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/review_gateway}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate            # schema owned by Flyway only
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

server:
  port: 8080
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health             # NO prometheus; business metrics = custom /metrics
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  diff:
    context-window: 16384
    prompt-reserve: 2000
    answer-reserve: 4000
    max-diff-tokens: 10000          # derived cap; per-chunk budget as of V2 diff chunking (CSR-05)
    chars-per-token: 4              # heuristic for the token estimator
    # F-DC-04 fix: this MUST match the CSR-02 formula (max-chunks * max-diff-tokens * chars-per-token
    # * 1.5 safety-factor + 20000 fixed overhead) -- 5 * 10000 * 4 * 1.5 + 20000 = 320000 with the
    # stock defaults below. This value previously stayed at the pre-chunking 100000, silently capping
    # every chunked Review at ~2 chunks regardless of gateway.diff.max-chunks. Recompute and update
    # this (and MAX_REQUEST_BODY_BYTES if set) if max-chunks/max-diff-tokens/chars-per-token change.
    max-request-body-bytes: ${MAX_REQUEST_BODY_BYTES:320000}  # SR-11/CSR-02 edge cap for POST /reviews
  heartbeat:
    interval: 60s                   # expected worker ping cadence
    timeout: 180s                   # stuck if now - heartbeat_at exceeds this
  retry:
    max-attempts: 3
  job:
    max-duration: 45m               # hard cap backstop
  publish:
    max-comment-count: 50
    max-comment-length: 4000
    max-raw-response-length: 200000 # SR-21
    max-request-body-bytes: 500000  # SR-11 edge cap for POST /jobs/{id}/result
  scheduler:
    heartbeat-check-interval: 30s
    backend-health-interval: 60s
    publish-retry-interval: 60s
  gitlab:
    base-url: ${GITLAB_BASE_URL:https://gitlab.example.com/api/v4}
    token: ${GITLAB_TOKEN}          # masked in toString; only Gateway holds this
    # Prompt Manager (V3, PMR-15): a SEPARATE, read-only GitLab credential -- never the write-scoped
    # token above. Only required (checked for presence, SR-01) when gateway.prompt.enabled=true; with
    # the kill-switch at its shipped default (false, see below), this stays unset and unchecked.
    prompt-token: ${GITLAB_PROMPT_TOKEN:}
    connect-timeout: 5s
    read-timeout: 30s
  backend:
    connect-timeout: 3s
    read-timeout: 5s
    allowed-host-pattern: ${BACKEND_ALLOWED_HOST_PATTERN:.*}   # SR-10: tighten per deployment
  security:
    ci-token: ${CI_TOKEN}
    worker-token: ${WORKER_TOKEN}
    admin-token: ${ADMIN_TOKEN}
  prompt:
    # F-PM-02: shipped safe-by-default OFF, deliberately deviating from the architecture doc's original
    # ${PROMPT_MANAGER_ENABLED:true} example -- a stock/upgraded Gateway must keep booting with today's
    # Worker-JAR-only behavior (byte-identical to pre-V3, PMR-10's own premise) until an operator has
    # actually provisioned GITLAB_PROMPT_TOKEN + PROMPT_CORPORATE_PROJECT and opts in explicitly. This
    # is the same default GatewayProperties.Prompt#enabled now carries in code, so the two can never
    # disagree with each other the way this finding's root cause did. See docs/security/
    # feature-prompt-manager-sast-report.md F-PM-02 and DEPLOYMENT.md §2 for the full rationale.
    enabled: ${PROMPT_MANAGER_ENABLED:false}
    corporate:
      project: ${PROMPT_CORPORATE_PROJECT:}   # numeric id or "group/project" path -- NEVER a URL (PMR-14)
      ref: ${PROMPT_CORPORATE_REF:main}
      base-prompt-path: ${PROMPT_CORPORATE_BASE_PROMPT_PATH:prompts/base-system-prompt.md}
      review-rules-path: ${PROMPT_CORPORATE_REVIEW_RULES_PATH:prompts/review-rules.md}
    project:
      enabled: true
      # ref is ALWAYS the project's own default branch unless a gateway.prompt.project.overrides.*.ref
      # entry sets one explicitly (architecture §0.1) -- no top-level env var for it by design.
      architecture-path: .ai-review/architecture.md
      code-rules-path: .ai-review/code-rules.md
    error-handling:
      on-error: ${PROMPT_ON_ERROR:FAIL}   # FAIL | SKIP_OPTIONAL -- corporate sections are ALWAYS FAIL, not configurable
    message-format: MULTI       # MULTI | SINGLE -- default MULTI (PMR-22); backends.prompt_message_format overrides per-backend
    section-separator: "\n\n---\n\n"   # SINGLE mode only
    limits:
      max-file-bytes: 262144
      max-system-prompt-tokens: 6000
      min-diff-budget-tokens: 1000
      max-sections: 4
      max-concurrent-resolutions: 4          # PMR-19 semaphore permits
    connect-timeout: 3s
    read-timeout: 8s
    total-timeout: 20s

# NOTE: gateway.security.*/gateway.gitlab.token MUST be >=32 chars (SR-01) and
# gateway.gitlab.base-url MUST be https:// (SR-15) -- GatewayProperties fails startup otherwise.
# All four secrets come from environment variables, never committed (see systemd EnvironmentFile /
# a local .env excluded from version control for a dev deployment).
#
# Prompt Manager (V3): gateway.prompt.enabled defaults to false (env: PROMPT_MANAGER_ENABLED) -- with
# it off, none of gateway.prompt.* below is validated at startup (GatewayProperties.
# validatePromptOnStartup) and GITLAB_PROMPT_TOKEN is never required. To opt in, set
# PROMPT_MANAGER_ENABLED=true and provision GITLAB_PROMPT_TOKEN + PROMPT_CORPORATE_PROJECT (see
# DEPLOYMENT.md §2).
