# Local stack for the two images in this repo: review-gateway (root Dockerfile) + llm-worker
# (worker/Dockerfile), backed by a real Postgres. This is the containerized equivalent of
# DEPLOYMENT.md §11.2's verified local smoke test, wired up as a single `docker compose up`.
#
# Set up for TWO Workers, each paired 1:1 with its own real llama-server host, per this project's
# architecture (README §1: "Running N llama-server instances means running N Worker processes,
# each with its own backend.id/llama.url" -- there is no shared-backend scaling knob, a Worker
# always talks to exactly one llama-server). Adding a third means copying the `worker2`/backend row
# pattern below once more (worker3, llama-03, LLAMA_URL_3, WORKER_ID default worker-llama-03, ...).
#
# Required secrets (no defaults on purpose -- same fail-fast behavior as the bare-jar deployment,
# see DEPLOYMENT.md §2 "Token generation"). Export these before running, or put them in a `.env`
# file next to this one:
#
#   export DB_PASSWORD=change-me-to-a-real-secret
#   export CI_TOKEN=$(openssl rand -hex 32)
#   export WORKER_TOKEN=$(openssl rand -hex 32)
#   export ADMIN_TOKEN=$(openssl rand -hex 32)
#   export GITLAB_TOKEN=$(openssl rand -hex 32)          # a real GitLab project/group token for actual use
#   export LLAMA_MODEL=qwen2.5-coder                     # same model on both hosts per this setup
#   export LLAMA_URL_1=http://192.168.1.101:8000         # first llama-server host
#   export LLAMA_URL_2=http://192.168.1.102:8000         # second llama-server host
#
# Then:
#   docker compose up --build
#
# What you get: Postgres (Flyway migration runs automatically inside the Gateway on first connect),
# the Gateway on http://localhost:8080, a one-shot job that registers two backend rows ("llama-01"
# -> LLAMA_URL_1, "llama-02" -> LLAMA_URL_2), and two Workers, each claiming only its own backend's
# jobs.
#
# The one real gotcha (documented in worker/README.md §6.3 and DEPLOYMENT.md §11.2): each Worker's
# WorkerProperties refuses a plain-http GATEWAY_URL unless it resolves to an actual loopback address.
# A compose service-name hostname (http://gateway:8080) does NOT count as loopback. Both `worker1`/
# `worker2` services below work around this with `network_mode: "service:gateway"`, which makes each
# one share the Gateway container's network namespace outright -- so http://127.0.0.1:8080 is
# genuinely loopback from either Worker's point of view, exactly like the manually-verified
# `--network host` recipe in DEPLOYMENT.md, but without needing host networking. Multiple containers
# are allowed to share one container's network namespace simultaneously, so both Workers doing this
# against the same `gateway` container is fine. This only matters for this local/plain-HTTP setup --
# in a real deployment the Gateway sits behind a reverse proxy over HTTPS and none of this applies
# (DEPLOYMENT.md §11.1); reaching each Worker's own remote llama-server (LLAMA_URL_1/2, a real LAN
# host, not loopback) is unaffected either way -- that traffic just goes out through the shared
# network namespace's normal outbound connectivity.

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: review_gateway
      POSTGRES_USER: review_gateway
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airg

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: review-gateway:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/review_gateway
      DB_USER: review_gateway
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      CI_TOKEN: ${CI_TOKEN:?set CI_TOKEN, e.g. openssl rand -hex 32}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN, e.g. openssl rand -hex 32}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN, e.g. openssl rand -hex 32}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.example.com/api/v4}
      GITLAB_TOKEN: ${GITLAB_TOKEN:?set GITLAB_TOKEN, a GitLab project/group access token}
      BACKEND_ALLOWED_HOST_PATTERN: ${BACKEND_ALLOWED_HOST_PATTERN:-.*}
      # Prompt Manager (V3, optional) -- Compose only forwards variables listed here; exporting them
      # in the host shell alone has no effect on the container. Left at their off-by-default values
      # unless the corresponding host env var is actually exported (see README.md §4.4).
      PROMPT_MANAGER_ENABLED: ${PROMPT_MANAGER_ENABLED:-false}
      GITLAB_PROMPT_TOKEN: ${GITLAB_PROMPT_TOKEN:-}
      PROMPT_CORPORATE_PROJECT: ${PROMPT_CORPORATE_PROJECT:-}
      PROMPT_CORPORATE_REF: ${PROMPT_CORPORATE_REF:-main}
      PROMPT_CORPORATE_BASE_PROMPT_PATH: ${PROMPT_CORPORATE_BASE_PROMPT_PATH:-prompts/base-system-prompt.md}
      PROMPT_CORPORATE_REVIEW_RULES_PATH: ${PROMPT_CORPORATE_REVIEW_RULES_PATH:-prompts/review-rules.md}
      PROMPT_ON_ERROR: ${PROMPT_ON_ERROR:-FAIL}
    ports:
      - "8080:8080"
    # GITLAB_BASE_URL uses the gitlab.local hostname (its self-signed cert's SAN is issued for
    # that name, not for a bare IP -- TLS hostname verification would fail otherwise). gitlab.local
    # is a .local/mDNS name that this container can't resolve on its own (no Avahi/nss-mdns in the
    # minimal JRE image), so pin it to the real GitLab host statically instead.
    extra_hosts:
      - "gitlab.local:192.168.1.101"
    # Overrides the JRE's default truststore with a copy that additionally trusts the mkcert-issued
    # cert GitLab's nginx presents for gitlab.local -- that cert is signed by a local-only mkcert CA
    # the JRE has no reason to trust otherwise. Regenerate certs/cacerts (see README/DEPLOYMENT.md)
    # if that cert is ever rotated.
    volumes:
      - ./certs/cacerts:/opt/java/openjdk/lib/security/cacerts:ro
    networks:
      - airg
    # HEALTHCHECK is baked into the image (curl GET /health); depends_on: condition: service_healthy
    # elsewhere in this file relies on it.

  backend-seed:
    # One-shot job: registers both backend rows (DEPLOYMENT.md §5 -- there is no REST endpoint for
    # this, only a direct SQL insert). Runs once the Gateway is healthy, i.e. after Flyway has
    # already created the `backends` table -- inserting any earlier would fail with "relation does
    # not exist". Idempotent (ON CONFLICT on the UNIQUE `name` column), safe to re-run on every
    # `docker compose up`.
    image: postgres:14-alpine
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      LLAMA_URL_1: ${LLAMA_URL_1:?set LLAMA_URL_1, e.g. http://192.168.1.101:8000}
      LLAMA_URL_2: ${LLAMA_URL_2:?set LLAMA_URL_2, e.g. http://192.168.1.102:8000}
      LLAMA_MODEL: ${LLAMA_MODEL:?set LLAMA_MODEL}
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U review_gateway -d review_gateway -c
        "INSERT INTO backends (name, url, model, capacity) VALUES
         ('llama-01', '$$LLAMA_URL_1', '$$LLAMA_MODEL', 1),
         ('llama-02', '$$LLAMA_URL_2', '$$LLAMA_MODEL', 1)
         ON CONFLICT (name) DO NOTHING;"
    networks:
      - airg
    restart: "no"

  worker1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: llm-worker:local
    depends_on:
      backend-seed:
        condition: service_completed_successfully
    network_mode: "service:gateway"
    environment:
      GATEWAY_URL: http://127.0.0.1:8080
      GATEWAY_API_KEY: ${WORKER_TOKEN:?set WORKER_TOKEN, must equal the Gateway's value}
      WORKER_ID: ${WORKER_ID_1:-worker-llama-01}
      BACKEND_ID: llama-01
      LLAMA_MODEL: ${LLAMA_MODEL:?set LLAMA_MODEL}
      LLAMA_URL: ${LLAMA_URL_1:?set LLAMA_URL_1, e.g. http://192.168.1.101:8000}
      WORKER_ALLOW_INSECURE_GATEWAY: "true"
      # Both workers share the Gateway's network namespace (network_mode: service:gateway below),
      # so their Actuator ports would collide on the default 8081 -- pin distinct ports.
      WORKER_HTTP_PORT: "8081"
    # No `ports:` here -- forbidden alongside network_mode, and the Worker's Actuator
    # (server.address: 127.0.0.1, hardcoded) is only ever meant to be reached via
    # `docker compose exec worker1 curl http://127.0.0.1:8081/actuator/health` anyway.

  worker2:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: llm-worker:local
    depends_on:
      backend-seed:
        condition: service_completed_successfully
    network_mode: "service:gateway"
    environment:
      GATEWAY_URL: http://127.0.0.1:8080
      GATEWAY_API_KEY: ${WORKER_TOKEN:?set WORKER_TOKEN, must equal the Gateway's value}
      WORKER_ID: ${WORKER_ID_2:-worker-llama-02}
      BACKEND_ID: llama-02
      LLAMA_MODEL: ${LLAMA_MODEL:?set LLAMA_MODEL}
      LLAMA_URL: ${LLAMA_URL_2:?set LLAMA_URL_2, e.g. http://192.168.1.102:8000}
      WORKER_ALLOW_INSECURE_GATEWAY: "true"
      # Must differ from worker1's -- see the comment there; both share one network namespace.
      WORKER_HTTP_PORT: "8082"
    # Actuator check: `docker compose exec worker2 curl http://127.0.0.1:8082/actuator/health`.
    # You can't tell the two Workers apart by connecting from outside either way (no ports are
    # published) -- use `docker compose logs worker1`/`worker2` or `docker compose exec workerN ...`.

volumes:
  postgres-data:

networks:
  airg:
