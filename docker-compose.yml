# Local stack for review-gateway (root Dockerfile), backed by a real Postgres, plus an OPTIONAL
# one-shot backend-registration job. This stack is Postgres + Gateway (+ optionally backend
# registration) ONLY.
#
# Workers are NOT part of this file. As of the AIReviewGateway/AIReviewWorker repository split
# (docs/worker-gateway-split-architecture.md), each Worker lives in its own process/host, deployed
# from github.com/pirum1ch/AIReviewWorker (present in this repo as a submodule at worker/) via that
# repo's own docker-compose.yml -- one Worker per llama-server host. See worker/README.md §6.4.
#
# Required secrets (no defaults on purpose -- same fail-fast behavior as the bare-jar deployment,
# see DEPLOYMENT.md §2 "Token generation"). Export these before running, or put them in a `.env`
# file next to this one:
#
#   export DB_PASSWORD=change-me-to-a-real-secret
#   export CI_TOKEN=$(openssl rand -hex 32)
#   export WORKER_TOKEN=$(openssl rand -hex 32)      # each Worker's GATEWAY_API_KEY must equal this
#   export ADMIN_TOKEN=$(openssl rand -hex 32)
#   export GITLAB_TOKEN=$(openssl rand -hex 32)          # a real GitLab project/group token for actual use
#
# Then:
#   docker compose up -d --build
#
# That's it -- the Gateway starts with ZERO registered backends. Pick ONE of these to actually get a
# backend registered (see AIReviewGateway/DEPLOYMENT.md's cross-repo coupling table for the values
# that must stay in sync between whichever of these you pick and the Worker side):
#
#   (a) Backend Self-Registration (recommended, no values to type here at all): set
#       BACKEND_SELF_REGISTRATION_ENABLED=true + a real BACKEND_ALLOWED_HOST_PATTERN below, then set
#       BACKEND_URL on the Worker's own docker-compose.yml/.env -- the Worker announces itself to the
#       Gateway on startup. Nothing about the backend's address is configured on this side at all.
#   (b) Admin API, one call per backend, once: `POST /backends` with the ADMIN_TOKEN above -- see
#       README.md's endpoint table. No LLAMA_URL_*/LLAMA_MODEL vars needed here either.
#   (c) The `backend-seed` service below (legacy, opt-in via a Compose profile): registers exactly
#       two hardcoded backend rows from LLAMA_URL_1/LLAMA_URL_2/LLAMA_MODEL, useful for a quick local
#       smoke test. It does NOT run on a plain `docker compose up` -- it needs the `seed` profile:
#
#         LLAMA_MODEL=qwen2.5-coder \
#         LLAMA_URL_1=http://192.168.1.101:8000 \
#         LLAMA_URL_2=http://192.168.1.102:8000 \
#         docker compose --profile seed up -d --build
#
# Jobs sit in QUEUED until some backend is registered (any of the three paths above) and a Worker
# claims them.
#
# gateway's `ports:` binds to 127.0.0.1 only (mirrors the postgres service's own pattern below).
# With Workers off-host, a TLS-terminating reverse proxy is the ONLY intended ingress to the Gateway
# -- the origin port must not be reachable from the Worker network. Bind the proxy to this same host
# and have it forward to 127.0.0.1:8080, or re-map this to a private interface plus a host firewall
# rule admitting only the proxy, per DEPLOYMENT.md §2/§11.1.

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: review_gateway
      POSTGRES_USER: review_gateway
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airg

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: review-gateway:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/review_gateway
      DB_USER: review_gateway
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      CI_TOKEN: ${CI_TOKEN:?set CI_TOKEN, e.g. openssl rand -hex 32}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN, e.g. openssl rand -hex 32}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN, e.g. openssl rand -hex 32}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.example.com/api/v4}
      GITLAB_TOKEN: ${GITLAB_TOKEN:?set GITLAB_TOKEN, a GitLab project/group access token}
      BACKEND_ALLOWED_HOST_PATTERN: ${BACKEND_ALLOWED_HOST_PATTERN:-.*}
      # Backend Self-Registration (docs/backend-self-registration-architecture.md) -- off by default.
      # Turning this on lets a Worker register/repoint its own backends row via POST /backends/announce
      # instead of the backend-seed job below / the admin API. If you enable it, BACKEND_ALLOWED_HOST_PATTERN
      # above MUST be narrowed to your real backend network first -- the Gateway refuses to start with
      # self-registration on and an effectively-universal pattern (still .* by default here).
      BACKEND_SELF_REGISTRATION_ENABLED: ${BACKEND_SELF_REGISTRATION_ENABLED:-false}
      BACKEND_MAX_BACKENDS: ${BACKEND_MAX_BACKENDS:-16}
      # Prompt Manager (V3, optional) -- Compose only forwards variables listed here; exporting them
      # in the host shell alone has no effect on the container. Left at their off-by-default values
      # unless the corresponding host env var is actually exported (see README.md §4.4).
      PROMPT_MANAGER_ENABLED: ${PROMPT_MANAGER_ENABLED:-false}
      GITLAB_PROMPT_TOKEN: ${GITLAB_PROMPT_TOKEN:-}
      PROMPT_CORPORATE_PROJECT: ${PROMPT_CORPORATE_PROJECT:-}
      PROMPT_CORPORATE_REF: ${PROMPT_CORPORATE_REF:-main}
      PROMPT_CORPORATE_BASE_PROMPT_PATH: ${PROMPT_CORPORATE_BASE_PROMPT_PATH:-prompts/base-system-prompt.md}
      PROMPT_CORPORATE_REVIEW_RULES_PATH: ${PROMPT_CORPORATE_REVIEW_RULES_PATH:-prompts/review-rules.md}
      PROMPT_ON_ERROR: ${PROMPT_ON_ERROR:-FAIL}
      # Structured Review Output (docs/structured-review-output-architecture.md) -- same rule as the
      # Prompt Manager block above: Compose only forwards variables listed here. Left at their
      # off-by-default-risk values (v3 not allowlisted, no backend constrained) unless the operator
      # explicitly exports the corresponding host env var (see README.md's promptVersion v3 section).
      ALLOWED_PROMPT_VERSIONS: ${ALLOWED_PROMPT_VERSIONS:-v1,v2}
      STRUCTURED_OUTPUT_ENABLED: ${STRUCTURED_OUTPUT_ENABLED:-true}
      STRUCTURED_OUTPUT_DEFAULT_MODE: ${STRUCTURED_OUTPUT_DEFAULT_MODE:-OFF}
    ports:
      - "127.0.0.1:8080:8080"
    # GITLAB_BASE_URL uses the gitlab.local hostname (its self-signed cert's SAN is issued for
    # that name, not for a bare IP -- TLS hostname verification would fail otherwise). gitlab.local
    # is a .local/mDNS name that this container can't resolve on its own (no Avahi/nss-mdns in the
    # minimal JRE image), so pin it to the real GitLab host statically instead.
    extra_hosts:
      - "gitlab.local:192.168.1.101"
    # Overrides the JRE's default truststore with a copy that additionally trusts the mkcert-issued
    # cert GitLab's nginx presents for gitlab.local -- that cert is signed by a local-only mkcert CA
    # the JRE has no reason to trust otherwise. Regenerate certs/cacerts (see README/DEPLOYMENT.md)
    # if that cert is ever rotated.
    volumes:
      - ./certs/cacerts:/opt/java/openjdk/lib/security/cacerts:ro
    networks:
      - airg
    # HEALTHCHECK is baked into the image (curl GET /health); depends_on: condition: service_healthy
    # elsewhere in this file relies on it.

  backend-seed:
    # Legacy, opt-in local-smoke-test helper -- see the header comment above for the other two
    # (recommended) ways to register a backend. Does NOT run on a plain `docker compose up`; needs
    # `docker compose --profile seed up`, which is also what makes LLAMA_URL_1/LLAMA_URL_2/LLAMA_MODEL
    # required only in that mode, not on every startup.
    #
    # One-shot job: registers both backend rows via a direct SQL insert (there's also a proper
    # `POST /backends` admin endpoint now -- see the header comment). Runs once the Gateway is
    # healthy, i.e. after Flyway has already created the `backends` table -- inserting any earlier
    # would fail with "relation does not exist". Idempotent (ON CONFLICT on the UNIQUE `name`
    # column), safe to re-run. Stays Gateway-side by design -- only the Gateway owns PostgreSQL.
    profiles: ["seed"]
    image: postgres:14-alpine
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      LLAMA_URL_1: ${LLAMA_URL_1:?set LLAMA_URL_1, e.g. http://192.168.1.101:8000}
      LLAMA_URL_2: ${LLAMA_URL_2:?set LLAMA_URL_2, e.g. http://192.168.1.102:8000}
      LLAMA_MODEL: ${LLAMA_MODEL:?set LLAMA_MODEL}
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U review_gateway -d review_gateway -c
        "INSERT INTO backends (name, url, model, capacity) VALUES
         ('llama-01', '$$LLAMA_URL_1', '$$LLAMA_MODEL', 1),
         ('llama-02', '$$LLAMA_URL_2', '$$LLAMA_MODEL', 1)
         ON CONFLICT (name) DO NOTHING;"
    networks:
      - airg
    restart: "no"

volumes:
  postgres-data:

networks:
  airg:
